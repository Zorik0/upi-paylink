<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#047857" />
    <title>Offline · UPI PayLink</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f8fafc;
        color: #0f172a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { font-size: 20px; margin: 20px 0 8px; }
      p { color: #64748b; margin: 0 0 24px; line-height: 1.5; }
      button {
        font: inherit;
        font-weight: 600;
        border: 0;
        border-radius: 12px;
        padding: 12px 24px;
        background: #0f172a;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>UPI payments need an internet connection.<br />Connect to Wi-Fi or mobile data and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
